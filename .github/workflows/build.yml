name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK & NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -qo /tmp/cmdline.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create App Files
        run: |
          mkdir -p app/src/main/cpp app/src/main/java/com/example/agentterm

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AgentTerm"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.agentterm"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.agentterm"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.4"
                  ndk { abiFilters += listOf("arm64-v8a", "x86_64") }
              }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt") } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="AgentTerm" android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("agentterm")
          add_library(agentterm SHARED pty_bridge.cpp)
          target_link_libraries(agentterm log)
          EOF

          cat << 'EOF' > app/src/main/cpp/pty_bridge.cpp
          #include <jni.h>
          #include <pty.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <string>

          static int g_master = -1;

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_example_agentterm_MainActivity_startShell(
              JNIEnv* env,
              jobject,
              jstring homeDir,
              jstring tmpDir,
              jstring nativeLibDir
          ) {
              if (g_master >= 0) return JNI_TRUE;

              const char* homeChars = homeDir ? env->GetStringUTFChars(homeDir, nullptr) : nullptr;
              const char* tmpChars = tmpDir ? env->GetStringUTFChars(tmpDir, nullptr) : nullptr;
              const char* libChars = nativeLibDir ? env->GetStringUTFChars(nativeLibDir, nullptr) : nullptr;

              std::string homeStr = homeChars ? homeChars : "/data/local/tmp";
              std::string tmpStr = tmpChars ? tmpChars : "/data/local/tmp";
              std::string libStr = libChars ? libChars : "/system/lib64";

              if (homeChars) env->ReleaseStringUTFChars(homeDir, homeChars);
              if (tmpChars) env->ReleaseStringUTFChars(tmpDir, tmpChars);
              if (nativeLibDir && libChars) env->ReleaseStringUTFChars(nativeLibDir, libChars);

              int master = -1;
              pid_t pid = forkpty(&master, nullptr, nullptr, nullptr);
              if (pid < 0) return JNI_FALSE;

              if (pid == 0) {
                  chdir(homeStr.c_str());
                  setenv("HOME", homeStr.c_str(), 1);
                  setenv("TMPDIR", tmpStr.c_str(), 1);
                  setenv("TERM", "xterm-256color", 1);

                  std::string pathEnv = homeStr + "/bin:" + homeStr + "/node_modules/.bin:/system/bin:/system/xbin";
                  setenv("PATH", pathEnv.c_str(), 1);

                  std::string ldEnv = libStr + ":" + homeStr + "/lib:/system/lib64:/system/lib";
                  setenv("LD_LIBRARY_PATH", ldEnv.c_str(), 1);

                  execl("/system/bin/sh", "sh", nullptr);
                  _exit(127);
              }

              int flags = fcntl(master, F_GETFL, 0);
              fcntl(master, F_SETFL, flags | O_NONBLOCK);
              g_master = master;
              return JNI_TRUE;
          }

          extern "C" JNIEXPORT void JNICALL
          Java_com_example_agentterm_MainActivity_sendRaw(JNIEnv* env, jobject, jstring data) {
              if (g_master < 0 || !data) return;
              const char* chars = env->GetStringUTFChars(data, nullptr);
              if (chars) {
                  std::string s(chars);
                  write(g_master, s.c_str(), s.size());
                  env->ReleaseStringUTFChars(data, chars);
              }
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_example_agentterm_MainActivity_readOutput(JNIEnv* env, jobject) {
              if (g_master < 0) return env->NewStringUTF("");
              char buf[2048];
              std::string out;
              ssize_t n;
              while ((n = read(g_master, buf, sizeof(buf) - 1)) > 0) {
                  buf[n] = '\0';
                  out.append(buf);
              }
              return env->NewStringUTF(out.c_str());
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/agentterm/MainActivity.kt
          package com.example.agentterm

          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.card.MaterialCardView
          import java.io.BufferedInputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.InputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors
          import java.util.zip.GZIPInputStream
          import java.util.zip.ZipInputStream

          class MainActivity : AppCompatActivity() {
              companion object { init { System.loadLibrary("agentterm") } }

              external fun startShell(homeDir: String, tmpDir: String, nativeLibDir: String): Boolean
              external fun sendRaw(data: String)
              external fun readOutput(): String

              private lateinit var cardsContainer: LinearLayout
              private lateinit var scrollView: ScrollView
              private lateinit var inputBox: EditText
              private var currentOutputView: TextView? = null
              private val handler = Handler(Looper.getMainLooper())
              private val ioExecutor = Executors.newCachedThreadPool()

              private lateinit var workspaceDir: File
              private lateinit var binDir: File
              private lateinit var tmpDir: File
              private var nativeLibDir: String = ""

              private val pollRunnable = object : Runnable {
                  override fun run() {
                      val chunk = readOutput()
                      if (chunk.isNotEmpty()) appendOutput(chunk)
                      handler.postDelayed(this, 80)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  workspaceDir = File(filesDir, "workspace").apply { mkdirs() }
                  binDir = File(workspaceDir, "bin").apply { mkdirs() }
                  tmpDir = File(cacheDir, "tmp").apply { mkdirs() }
                  nativeLibDir = applicationInfo.nativeLibraryDir ?: ""

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(24, 36, 24, 24)
                  }

                  val header = TextView(this).apply {
                      text = "⚡ AgentTerm (Tool Loader & Shell)"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 17f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 0, 12)
                  }
                  root.addView(header)

                  val helpHint = TextView(this).apply {
                      text = "أوامر: fetch <url> [name] | runsh <file.sh> | runbin <path> | envinfo"
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 11f
                      setPadding(0, 0, 0, 10)
                  }
                  root.addView(helpHint)

                  scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  }
                  cardsContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  scrollView.addView(cardsContainer)
                  root.addView(scrollView)

                  val touchBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 10, 0, 10)
                  }
                  val quickKeys = listOf(
                      "Env" to "ENV_INFO",
                      "Fetch" to "PREFILL_FETCH",
                      "Ctrl+C" to "\u0003",
                      "ls" to "ls -la\n",
                      "Clear" to "CLEAR"
                  )
                  for ((label, payload) in quickKeys) {
                      val btn = Button(this).apply {
                          text = label
                          textSize = 10f
                          maxLines = 1
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor("#1E293B"))
                          setOnClickListener {
                              when (payload) {
                                  "CLEAR" -> {
                                      cardsContainer.removeAllViews()
                                      currentOutputView = null
                                  }
                                  "ENV_INFO" -> {
                                      addBlock("envinfo")
                                      sendRaw("echo \"ARCH=\$(uname -m) | WS=${workspaceDir.absolutePath}\"; ls -la \"${workspaceDir.absolutePath}\"\n")
                                  }
                                  "PREFILL_FETCH" -> {
                                      inputBox.setText("fetch https://")
                                      inputBox.setSelection(inputBox.text.length)
                                  }
                                  else -> {
                                      if (payload.endsWith("\n")) addBlock(payload.trim())
                                      sendRaw(payload)
                                  }
                              }
                          }
                      }
                      touchBar.addView(
                          btn,
                          LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                              .apply { setMargins(3, 0, 3, 0) }
                      )
                  }
                  root.addView(touchBar)

                  val inputRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  inputBox = EditText(this).apply {
                      hint = "اكتب أمراً أو fetch <url>..."
                      setHintTextColor(Color.parseColor("#64748B"))
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setPadding(24, 24, 24, 24)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val runBtn = Button(this).apply {
                      text = "تشغيل"
                      setTextColor(Color.parseColor("#0F172A"))
                      setBackgroundColor(Color.parseColor("#38BDF8"))
                      setOnClickListener {
                          val rawCmd = inputBox.text.toString().trim()
                          if (rawCmd.isNotEmpty()) {
                              inputBox.text.clear()
                              handleCommand(rawCmd)
                          }
                      }
                  }
                  inputRow.addView(inputBox)
                  inputRow.addView(runBtn)
                  root.addView(inputRow)
                  setContentView(root)

                  if (startShell(workspaceDir.absolutePath, tmpDir.absolutePath, nativeLibDir)) {
                      addBlock("Session Started -> ${workspaceDir.absolutePath}")
                      handler.post(pollRunnable)
                  } else {
                      addBlock("Error: Failed to start PTY shell")
                  }
              }

              private fun handleCommand(cmd: String) {
                  when {
                      cmd.equals("envinfo", ignoreCase = true) -> {
                          addBlock(cmd)
                          sendRaw("echo \"ARCH=\$(uname -m) | HOME=\$HOME | TMPDIR=\$TMPDIR\"; ls -la \"${workspaceDir.absolutePath}\"\n")
                      }
                      cmd.startsWith("fetch ", ignoreCase = true) -> {
                          val parts = cmd.split(Regex("\\s+")).filter { it.isNotBlank() }
                          if (parts.size < 2) {
                              addBlock(cmd)
                              appendOutput("الاستخدام: fetch <url> [output_name]\n")
                              return
                          }
                          val urlStr = parts[1]
                          val customName = if (parts.size >= 3) parts[2] else null
                          addBlock(cmd)
                          downloadAndExtract(urlStr, customName)
                      }
                      cmd.startsWith("runsh ", ignoreCase = true) -> {
                          val target = cmd.removePrefix("runsh ").trim()
                          addBlock(cmd)
                          val scriptFile = resolveWorkspaceFile(target)
                          if (!scriptFile.exists()) {
                              appendOutput("الملف غير موجود: ${scriptFile.absolutePath}\n")
                          } else {
                              sendRaw("sh \"${scriptFile.absolutePath}\"\n")
                          }
                      }
                      cmd.startsWith("runbin ", ignoreCase = true) -> {
                          val rawArgs = cmd.removePrefix("runbin ").trim()
                          addBlock(cmd)
                          if (rawArgs.isEmpty()) {
                              appendOutput("الاستخدام: runbin <path> [args...]\n")
                              return
                          }
                          val tokens = rawArgs.split(Regex("\\s+"))
                          val binFile = resolveWorkspaceFile(tokens[0])
                          if (!binFile.exists()) {
                              appendOutput("الثنائي غير موجود: ${binFile.absolutePath}\n")
                              return
                          }
                          binFile.setExecutable(true, false)
                          val argsStr = if (tokens.size > 1) " " + tokens.drop(1).joinToString(" ") else ""
                          appendOutput("تنبيه: في أندرويد قد يمنع النظام تنفيذ الثنائيات مباشرة من filesDir (Permission denied).\n")
                          sendRaw("\"${binFile.absolutePath}\"$argsStr\n")
                      }
                      else -> {
                          addBlock(cmd)
                          sendRaw(cmd + "\n")
                      }
                  }
              }

              private fun resolveWorkspaceFile(nameOrPath: String): File {
                  val f = File(nameOrPath)
                  return if (f.isAbsolute) f else File(workspaceDir, nameOrPath)
              }

              private fun downloadAndExtract(urlStr: String, customName: String?) {
                  appendOutput("جارٍ التحميل: $urlStr ...\n")
                  ioExecutor.execute {
                      try {
                          val url = URL(urlStr)
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              connectTimeout = 15000
                              readTimeout = 30000
                              instanceFollowRedirects = true
                              setRequestProperty("User-Agent", "AgentTerm-Android")
                          }
                          val code = conn.responseCode
                          if (code !in 200..299) {
                              runOnUiThread { appendOutput("فشل التحميل: HTTP $code\n") }
                              conn.disconnect()
                              return@execute
                          }

                          val rawName = customName
                              ?: url.path.substringAfterLast('/').takeIf { it.isNotBlank() }
                              ?: "downloaded_file"
                          val outFile = File(workspaceDir, rawName)

                          conn.inputStream.use { input ->
                              FileOutputStream(outFile).use { output ->
                                  val buf = ByteArray(8192)
                                  var total = 0L
                                  var readBytes: Int
                                  while (input.read(buf).also { readBytes = it } != -1) {
                                      output.write(buf, 0, readBytes)
                                      total += readBytes
                                  }
                                  runOnUiThread {
                                      appendOutput("تم الحفظ: ${outFile.absolutePath} ($total bytes)\n")
                                  }
                              }
                          }
                          conn.disconnect()

                          when {
                              rawName.endsWith(".zip", ignoreCase = true) -> {
                                  val extractDir = File(workspaceDir, rawName.removeSuffix(".zip")).apply { mkdirs() }
                                  extractZip(outFile, extractDir)
                                  runOnUiThread {
                                      appendOutput("تم فك ضغط ZIP إلى: ${extractDir.absolutePath}\n")
                                  }
                              }
                              rawName.endsWith(".tar.gz", ignoreCase = true) || rawName.endsWith(".tgz", ignoreCase = true) -> {
                                  val baseName = rawName
                                      .removeSuffix(".tar.gz")
                                      .removeSuffix(".tgz")
                                  val extractDir = File(workspaceDir, baseName).apply { mkdirs() }
                                  val extractedCount = extractTarGz(outFile, extractDir)
                                  runOnUiThread {
                                      appendOutput("تم فك ضغط TAR.GZ ($extractedCount ملف/مجلد) إلى: ${extractDir.absolutePath}\n")
                                  }
                              }
                              else -> {
                                  outFile.setExecutable(true, false)
                                  runOnUiThread {
                                      appendOutput("ملاحظة: في أندرويد قد يمنع النظام تنفيذ الملفات مباشرة من filesDir؛ استخدم runsh للملفات النصية أو runbin لاختبار الثنائيات.\n")
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              appendOutput("خطأ أثناء التحميل: ${e.message}\n")
                          }
                      }
                  }
              }

              private fun extractZip(zipFile: File, destDir: File) {
                  ZipInputStream(BufferedInputStream(zipFile.inputStream())).use { zis ->
                      var entry = zis.nextEntry
                      while (entry != null) {
                          val outFile = File(destDir, entry.name)
                          if (entry.isDirectory) {
                              outFile.mkdirs()
                          } else {
                              outFile.parentFile?.mkdirs()
                              FileOutputStream(outFile).use { fos ->
                                  val buf = ByteArray(8192)
                                  var len: Int
                                  while (zis.read(buf).also { len = it } != -1) {
                                      fos.write(buf, 0, len)
                                  }
                              }
                          }
                          zis.closeEntry()
                          entry = zis.nextEntry
                      }
                  }
              }

              private fun extractTarGz(tarGzFile: File, destDir: File): Int {
                  var count = 0
                  BufferedInputStream(GZIPInputStream(FileInputStream(tarGzFile))).use { tarStream ->
                      val header = ByteArray(512)
                      while (true) {
                          val headerRead = readFully(tarStream, header, 0, 512)
                          if (headerRead < 512) break
                          if (header.all { it == 0.toByte() }) break

                          val rawEntryName = parseTarString(header, 0, 100)
                          val prefix = parseTarString(header, 345, 155)
                          val entryName = if (prefix.isNotEmpty()) "$prefix/$rawEntryName" else rawEntryName
                          val size = parseTarOctal(header, 124, 12)
                          val typeFlag = header[156].toInt().toChar()

                          if (entryName.isNotEmpty()) {
                              val cleanName = entryName.removePrefix("./")
                              val outFile = File(destDir, cleanName)
                              when (typeFlag) {
                                  '5' -> {
                                      outFile.mkdirs()
                                      count++
                                  }
                                  '0', '\u0000' -> {
                                      outFile.parentFile?.mkdirs()
                                      FileOutputStream(outFile).use { fos ->
                                          copyExactBytes(tarStream, fos, size)
                                      }
                                      outFile.setExecutable(true, false)
                                      count++
                                  }
                                  else -> {
                                      skipExactBytes(tarStream, size)
                                  }
                              }
                          } else {
                              skipExactBytes(tarStream, size)
                          }

                          val remainder = (size % 512).toInt()
                          if (remainder > 0) {
                              skipExactBytes(tarStream, (512 - remainder).toLong())
                          }
                      }
                  }
                  return count
              }

              private fun readFully(input: InputStream, buf: ByteArray, offset: Int, len: Int): Int {
                  var total = 0
                  while (total < len) {
                      val n = input.read(buf, offset + total, len - total)
                      if (n <= 0) break
                      total += n
                  }
                  return total
              }

              private fun copyExactBytes(input: InputStream, fos: FileOutputStream, size: Long) {
                  var remaining = size
                  val buf = ByteArray(8192)
                  while (remaining > 0) {
                      val toRead = minOf(remaining, buf.size.toLong()).toInt()
                      val n = input.read(buf, 0, toRead)
                      if (n <= 0) break
                      fos.write(buf, 0, n)
                      remaining -= n
                  }
              }

              private fun skipExactBytes(input: InputStream, count: Long) {
                  var remaining = count
                  val buf = ByteArray(4096)
                  while (remaining > 0) {
                      val toRead = minOf(remaining, buf.size.toLong()).toInt()
                      val n = input.read(buf, 0, toRead)
                      if (n <= 0) break
                      remaining -= n
                  }
              }

              private fun parseTarString(buf: ByteArray, offset: Int, length: Int): String {
                  var end = offset + length
                  for (i in offset until offset + length) {
                      if (buf[i] == 0.toByte()) {
                          end = i
                          break
                      }
                  }
                  return String(buf, offset, end - offset, Charsets.UTF_8).trim()
              }

              private fun parseTarOctal(buf: ByteArray, offset: Int, length: Int): Long {
                  var value = 0L
                  for (i in offset until offset + length) {
                      val b = buf[i].toInt() and 0xFF
                      if (b == 0 || b == ' '.code) continue
                      if (b in '0'.code..'7'.code) {
                          value = (value shl 3) or (b - '0'.code)
                      }
                  }
                  return value
              }

              private fun addBlock(commandTitle: String) {
                  val card = MaterialCardView(this).apply {
                      setCardBackgroundColor(Color.parseColor("#1E293B"))
                      radius = 24f
                      cardElevation = 4f
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 0, 0, 20) }
                  }
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 20, 24, 20)
                  }
                  val titleView = TextView(this).apply {
                      text = "$ $commandTitle"
                      setTextColor(Color.parseColor("#34D399"))
                      typeface = Typeface.MONOSPACE
                      textSize = 13f
                  }
                  val outView = TextView(this).apply {
                      text = ""
                      setTextColor(Color.parseColor("#E2E8F0"))
                      typeface = Typeface.MONOSPACE
                      textSize = 12f
                      setPadding(0, 10, 0, 0)
                  }
                  box.addView(titleView)
                  box.addView(outView)
                  card.addView(box)
                  cardsContainer.addView(card)
                  currentOutputView = outView
                  scrollView.post { scrollView.fullScroll(ScrollView.FOCUS_DOWN) }
              }

              private fun appendOutput(text: String) {
                  if (currentOutputView == null) addBlock("Output")
                  currentOutputView?.append(text)
                  scrollView.post { scrollView.fullScroll(ScrollView.FOCUS_DOWN) }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(pollRunnable)
                  ioExecutor.shutdownNow()
              }
          }
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgentTerm-APK
          path: app/build/outputs/apk/debug/app-debug.apk
